server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Crucial for non-standard port Docker mappings (e.g. 8082:80, 8081:80).
    # Prevents nginx directory redirects from stripping host port 8082 and bouncing to port 80/8081.
    absolute_redirect off;
    port_in_redirect off;

    # Next static export with trailingSlash:true emits directory-style routes
    # (e.g. /shipments/ -> /shipments/index.html). Try the exact file, then the
    # directory index, then fall through to Next's generated 404 page.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Content-hashed build assets — safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML documents: always revalidate so deploys show up immediately, no
    # stale index.html served from a browser or intermediary cache.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    error_page 404 /404.html;
}
