# UAT counterpart to deploy.yml. Builds the static export image, pushes to
# GHCR tagged :uat (never :latest — that's prod's tag), then tells the VPS to
# pull + restart just the UAT `web` service in the SEPARATE
# /opt/ktransport-uat stack (compose file lives in kt_backend's repo). Never
# touches prod's /opt/ktransport containers.
#
# Promoting UAT-tested code to prod = merge `develop` -> `main`, which
# triggers deploy.yml (the prod workflow) on its own.
#
# Required repo secrets — SAME ones deploy.yml uses (same VPS, same deploy key):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
#
# Optional repo VARIABLE:
#   NEXT_PUBLIC_API_URL_UAT   Defaults to http://129.121.132.103:8081/api
#                             (UAT's own backend port — NOT prod's 8080).

name: Deploy frontend (UAT)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-frontend-uat
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nitesh-singh-1/ktfrontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_UAT || 'http://129.121.132.103:8081/api' }}
          tags: |
            ${{ env.IMAGE }}:uat
            ${{ env.IMAGE }}:uat-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (UAT stack only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ktransport-uat
            docker compose -f docker-compose.uat.yml pull web
            docker compose -f docker-compose.uat.yml up -d web
            docker image prune -f
