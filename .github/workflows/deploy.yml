# Builds the frontend static export as an nginx image, pushes to GHCR, then tells
# the VPS to pull + restart just the `web` service (docker-compose.yml on the VPS,
# owned by kt_backend's repo, orchestrates api+web+postgres together — this workflow
# never touches api or postgres).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST         VPS IP or hostname (e.g. 129.121.132.103)
#   SSH_USER         SSH user (e.g. root)
#   SSH_PRIVATE_KEY  Private half of the deploy keypair (the matching public key
#                    must already be in that user's ~/.ssh/authorized_keys on the VPS)
#
# Optional repo VARIABLE (Settings -> Secrets and variables -> Actions -> Variables tab):
#   NEXT_PUBLIC_API_URL   Public URL the browser should call for the API
#                         (defaults to http://129.121.132.103:8080/api if unset —
#                         update this once a real domain + HTTPS are set up).
#
# GHCR push needs no secret — GITHUB_TOKEN is automatic; the `permissions:` block
# below grants it package-write for this workflow run only.

name: Deploy frontend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  # Must exactly match the image ref used for `web` in kt_backend/docker-compose.yml.
  IMAGE: ghcr.io/nitesh-singh-1/ktfrontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://129.121.132.103:8080/api' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ktransport
            docker compose pull web
            docker compose up -d web
            docker image prune -f
